# This file configures the build system and project metadata for your package.
# It follows the standards defined in PEP 518 and PEP 621.

[build-system]
# Specifies the build tools needed to create your package.
# setuptools is a common and robust choice.
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
# Core metadata about your project.
name = "zmongo_retriever"
version = "0.1.0"
authors = [
  { name="John M. Iriye", email="Attorney@CentralFloridaAttorney.net" },
]
description = "A retriever for MongoDB using LangChain"

# The 'readme' key points to your project's detailed description file.
# The content type is automatically inferred from the file extension (.md).
readme = "README.md"

# Specifies your project's license using the modern SPDX identifier.
license = "MIT"

# Specifies the Python versions your project supports.
requires-python = ">=3.10"

# Classifiers help users find your project on PyPI.
# You can find a full list at https://pypi.org/classifiers/
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# Lists the external packages that your project depends on.
dependencies = [
    "python-dotenv",
    "pymongo",
    "motor",
    "pandas",
    "openai",
    "beautifulsoup4",
    "nest_asyncio",
    "nbformat",
    "ace-tools",
    "matplotlib",
    "opencv-python",
    "mtcnn",
    "langchain",
    "astor",
    "numpy",
    "tiktoken",
    "google-generativeai",
    "langchain-openai",
    "langchain-text-splitters",
    "langchain-core",
    "llama-cpp-python",
    "hnswlib",
    "scikit-learn",
]

[project.urls]
# Provides useful links related to your project.
"Homepage" = "https://github.com/CentralFloridaAttorney/zmongo_retriever"
"Bug Tracker" = "https://github.com/CentralFloridaAttorney/zmongo_retriever/issues"

# This new section explicitly tells setuptools which packages to include.
[tool.setuptools]
packages = ["zmongo_toolbag"]

